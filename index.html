<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latihan Olimpiade IPA SMP</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#14532d;--g2:#1f7a45;--bg:#eef5ec;--ln:#cfe0cf;--am:#f5b301;--rd:#c0392b;--ok:#1f8a4c}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Nunito,system-ui,sans-serif;background:var(--bg);color:#1b2a1f}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:1.05rem}
main{max-width:760px;margin:auto;padding:16px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:800;margin-top:10px}
.sm{background:transparent;color:#fff;border:2px solid #fff;border-radius:8px;padding:4px 12px;font-weight:700}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.hero h1{font-size:2rem;line-height:1.2;color:var(--g);margin:24px 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:20px}
.jj{background:#fff;border:3px solid var(--g);border-radius:16px;padding:22px 10px;color:var(--g);font-weight:700}
.jj b{display:block;font-size:2.4rem;line-height:1.1}
.jj:hover{background:var(--am)}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;padding:10px;border:2px solid var(--g);background:#fff;color:var(--g);border-radius:10px;font-weight:800}
.tabs .on,.chips .on{background:var(--g);color:#fff}
.chips button{border:2px solid var(--ln);background:#fff;border-radius:20px;padding:4px 14px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0}
.opt.ok{border-color:var(--ok);background:#e3f6e9}
.opt.no{border-color:var(--rd);background:#fdeaea}
.pb{background:#fff8dc;border-left:5px solid var(--am);padding:10px 12px;border-radius:6px;margin-top:10px}
.bar{height:8px;background:#d9e8d9;border-radius:8px;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--am);border-radius:8px}
h2{margin:24px 0 4px;color:var(--g)}
details{background:#fff;border:1px solid var(--ln);border-left:6px solid var(--g2);border-radius:10px;padding:8px 12px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
details p{margin:6px 0 2px}
.chips a{border:2px solid var(--ln);background:#fff;border-radius:20px;padding:4px 14px;margin-top:12px;color:var(--g);font-weight:700;text-decoration:none}
details ul{margin:6px 0 4px;padding-left:20px}
details li{margin:6px 0}
h2{scroll-margin-top:12px}
</style></head><body>
<header><b>Latihan Olimpiade IPA</b><span id="hj"></span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const sg=k=>{try{return localStorage.getItem(k)}catch(e){}};
const ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
/* TAMBAH SOAL: salin satu baris, isi k (kelas 7/8/9), b (bidang), q, o (4 opsi), a (indeks jawaban 0-3), p (pembahasan) */
const Q=[
{"k": 7, "b": "Biologi", "q": "Pada sore hari, daun lamtoro terlihat mengatup. Itu menunjukkan bahwa tumbuhan mempunyai ciri ...", "o": ["Tumbuh", "Bernapas", "Bergerak", "Berkembang"], "a": 2, "p": "Mengatupnya daun adalah gerak nasti, yaitu respons terhadap rangsang. Bergerak adalah salah satu ciri makhluk hidup."},
{"k": 7, "b": "Biologi", "q": "Faktor yang tidak menentukan laju fotosintesis adalah ...", "o": ["Suhu udara dan kelembapan", "Kandungan karbon dioksida", "Kecepatan transpirasi", "Ketersediaan air"], "a": 2, "p": "Laju fotosintesis dipengaruhi cahaya, suhu, CO₂, air, dan kelembapan. Transpirasi (penguapan air) bukan faktor penentu laju fotosintesis."},
{"k": 7, "b": "Biologi", "q": "Berikut yang tidak termasuk penyebab terjadinya pemanasan global adalah ...", "o": ["Emisi gas bahan bakar kendaraan", "Penebangan hutan", "Limbah industri", "Penghemat listrik"], "a": 3, "p": "Penghematan listrik mengurangi emisi pembangkit sehingga justru menekan pemanasan global. Penyebab lainnya menambah gas rumah kaca (CO₂, CH₄) atau mengurangi penyerapnya (hutan)."},
{"k": 7, "b": "Kimia", "q": "Dalam darah terkandung garam. Larutnya garam dalam darah merupakan peristiwa ...", "o": ["Kimia", "Fisika", "Biologi", "Fisiologis"], "a": 0, "p": "Kunci file: kimia, karena garam (NaCl) larut dan terurai menjadi ion Na⁺ dan Cl⁻. Catatan: banyak buku SMP menggolongkan pelarutan sebagai perubahan fisika."},
{"k": 7, "b": "IPBA", "q": "Sebuah komet bergerak mendekati matahari sampai jarak terdekat, lalu menjauhi matahari. Selama bergerak, ekor komet selalu menjauhi matahari. Ini disebabkan oleh ...", "o": ["Angin matahari", "Gaya sentrifugal", "Cahaya matahari", "Gravitasi matahari"], "a": 0, "p": "Ekor komet terbentuk dari gas dan debu yang terdorong angin Matahari (partikel bermuatan), sehingga selalu menjauhi Matahari."},
{"k": 7, "b": "Fisika", "q": "Kegiatan berikut yang nilai usahanya nol adalah ...", "o": ["Menarik meja dari ruang belajar ke ruang ruangan", "Mendorong mobil yang mogok hingga berpindah", "Menaikkan kardus dari lantai ke atas meja", "Mendorong tembok sekuat tenaga"], "a": 3, "p": "Usaha W = F x s. Tembok tidak berpindah (s = 0), jadi W = 0 walaupun gaya besar."},
{"k": 7, "b": "Kimia", "q": "Pernyataan berikut ini yang benar adalah ....", "o": ["Larutan adalah campuran yang homogen", "Setiap zat tunggal adalah unsur", "Senyawa adalah campuran homogen", "Unsur adalah zat yang dapat terurai menjadi zat lain"], "a": 0, "p": "Larutan adalah campuran homogen. Zat tunggal bisa unsur atau senyawa, senyawa adalah zat murni, dan unsur tidak dapat diuraikan secara kimia."},
{"k": 7, "b": "Biologi", "q": "Pada masyarakat penghasil kedelai, untuk meningkatkan mutu gizi dengan bahan dasar yang ada dalam memenuhi kebutuhan protein masyarakatnya, maka dapat menerapkan bioteknologi konvensional. Contoh bioteknologi yang dilakukan adalah dengan memanfaatkan...", "o": ["Rhizopus oryzae untuk membuat tauco", "Aspergillus wentii untuk membuat kecap", "Acetobacter xylinum untuk membuat oncom", "Saccharomyces cerevisiae"], "a": 1, "p": "Kecap dibuat dari kedelai dengan jamur Aspergillus wentii. Tempe memakai Rhizopus, oncom Neurospora, nata de coco Acetobacter xylinum."},
{"k": 7, "b": "Fisika", "q": "Hal yang dapat menyebabkan pesawat terbang dapat terangkat naik adalah ...", "o": ["Gaya dorong ke atas akibat jumlah udara yang dipindahkan badan pesawat", "Hambatan udara akibat luas permukaan pesawat", "Perbedaan tekanan udara di sisi atas dan bawah sayap pesawat", "Gaya aksi-reaksi dengan tanah"], "a": 2, "p": "Menurut Bernoulli, udara di atas sayap lebih cepat sehingga tekanannya lebih kecil daripada di bawah sayap. Selisih tekanan menghasilkan gaya angkat."},
{"k": 7, "b": "Biologi", "q": "Pada sampel urine terdeteksi adanya protein. Hal ini mengindikasikan terjadi kerusakan ginjal bagian ...", "o": ["Tubulus kontortus proksimal", "Tubulus kontortus distal", "Glomerulus", "Kapsula Bowman"], "a": 2, "p": "Glomerulus menyaring darah; molekul besar seperti protein seharusnya tidak lolos. Protein dalam urine menandakan glomerulus rusak."},
{"k": 7, "b": "Kimia", "q": "Natrium hipoklorit (NaOCl) merupakan senyawa yang banyak digunakan untuk ...", "o": ["Pemutih", "Pembersih", "Pewangi", "Pelembut"], "a": 0, "p": "NaOCl (natrium hipoklorit) adalah oksidator kuat, dipakai sebagai pemutih dan desinfektan."},
{"k": 7, "b": "Fisika", "q": "Tono berkaca di spion mobil di depan rumahnya. Dia melihat bayangan dirinya bersifat...", "o": ["maya, tegak, diperkecil", "nyata, tegak, diperkecil", "nyata, tegak, diperbesar", "maya, terbalik, diperbesar"], "a": 0, "p": "Spion mobil berupa cermin cembung: bayangan selalu maya, tegak, dan diperkecil sehingga bidang pandangnya luas."},
{"k": 7, "b": "Fisika", "q": "Besaran di bawah ini yang merupakan besaran turunan dan sekaligus merupakan besaran vektor adalah...", "o": ["kuat arus listrik, gaya, kecepatan", "gaya, usaha, percepatan", "gaya berat, percepatan gravitasi, medan listrik", "temperatur, kelajuan, panjang lintasan"], "a": 2, "p": "Besaran turunan sekaligus vektor: gaya berat, percepatan gravitasi, medan listrik. Kuat arus, temperatur, dan panjang adalah besaran pokok."},
{"k": 7, "b": "Biologi", "q": "Bagian yang digunakan untuk menangkap dan meneruskan getaran dalam sistem pendengaran lumba-lumba apabila berada di dalam air adalah ...", "o": ["Telinga", "Telinga dan rahang bawah", "Rahang bawah", "Hidung"], "a": 2, "p": "Pada lumba-lumba, getaran bunyi dalam air ditangkap oleh rahang bawah lalu diteruskan ke telinga dalam."},
{"k": 7, "b": "Biologi", "q": "Makhluk hidup memiliki ciri-ciri yang membedakan mereka dengan kelompok makhluk tak hidup. Salah satu ciri dari makhluk hidup adalah bergerak. Gerak dari kloroplas pada daun hydrilla ketika menerima cahaya disebut dengan ...", "o": ["Gerak nasti", "Gerak taksis", "Gerak fotonasti", "Gerak fototaksis"], "a": 3, "p": "Gerak yang arahnya ditentukan arah cahaya dan memindahkan tempat disebut fototaksis. Nasti arahnya tidak ditentukan arah rangsang."},
{"k": 7, "b": "Biologi", "q": "Saluran yang menghubungkan antara kepala putik dengan ovarium adalah ...", "o": ["Bakal biji", "Tangkai putik", "Bakal buah", "Kelopak bunga"], "a": 1, "p": "Tangkai putik (stilus) menghubungkan kepala putik (stigma) dengan bakal buah (ovarium)."},
{"k": 7, "b": "Biologi", "q": "Nama lain dari corolla adalah ...", "o": ["Mahkota bunga", "Kelopak bunga", "Benang sari", "Putik"], "a": 0, "p": "Corolla adalah mahkota bunga; calyx adalah kelopak."},
{"k": 7, "b": "Fisika", "q": "Sebuah kereta bergerak dengan kecepatan konstan 200 km/jam, seseorang di dalam kereta berjalan dengan kecepatan 1 km/jam relatif terhadap kereta searah dengan arah gerak kereta. Jika seorang pengemudi motor bergerak dengan kecepatan 20 km/jam berlawanan arah dengan kereta. Berapa kecepatan orang di dalam kereta dilihat oleh pengemudi motor?", "o": ["221 km/jam", "219 km/jam", "181 km/jam", "179 km/jam"], "a": 0, "p": "Orang di kereta: 200 + 1 = 201 km/jam. Motor berlawanan arah 20 km/jam, maka kecepatan relatif dijumlahkan: 201 + 20 = 221 km/jam."},
{"k": 7, "b": "Biologi", "q": "Yang bukan merupakan tahapan dari metamorfosis tidak sempurna adalah ...", "o": ["Telur", "Nimfa", "Imago", "Pupa"], "a": 3, "p": "Metamorfosis tidak sempurna: telur, nimfa, imago. Pupa hanya ada pada metamorfosis sempurna."},
{"k": 7, "b": "Biologi", "q": "Urutan yang benar tentang tahapan metamorfosis pada kecoa adalah ...", "o": ["Telur - nimfa - kecoa dewasa", "Nimfa - kecoa dewasa - telur", "Telur - pupa - nimfa - kecoa dewasa", "Telur - nimfa - pupa - kecoa dewasa"], "a": 0, "p": "Kecoa bermetamorfosis tidak sempurna: telur, nimfa, dewasa (tanpa pupa)."},
{"k": 7, "b": "Biologi", "q": "Selain perkembangbiakan secara generatif, hewan juga dapat berkembangbiak secara vegetatif salah satunya dengan cara membelah diri. Contoh dari hewan yang berkembang biak secara membelah diri adalah ...", "o": ["Amoeba", "Cacing pipih", "Hydra", "Porifera"], "a": 0, "p": "Amoeba berkembang biak dengan membelah diri. Hydra bertunas, cacing pipih (planaria) berfragmentasi."},
{"k": 7, "b": "Fisika", "q": "Berikut merupakan contoh gerak parabola adalah...", "o": ["Mobil berjalan di jalan lurus", "Peluru ditembakkan dengan sudut tertentu", "Buah jatuh dari pohonnya", "Ikan berenang di dalam air"], "a": 1, "p": "Gerak parabola adalah gabungan GLB horizontal dan GLBB vertikal, mis. peluru yang ditembakkan dengan sudut tertentu."},
{"k": 7, "b": "Fisika", "q": "Gerakan jarum jam merupakan contoh gerak...", "o": ["Gerak melingkar beraturan", "Gerak melingkar berubah beraturan", "Gerak parabola", "Gerak berputar"], "a": 0, "p": "Ujung jarum jam bergerak melingkar dengan laju sudut tetap: gerak melingkar beraturan."},
{"k": 7, "b": "Biologi", "q": "Berikut ini yang termasuk faktor abiotik suatu ekosistem adalah…", "o": ["rumput", "burung merpati", "bebatuan", "semak semak"], "a": 2, "p": "Abiotik adalah komponen tak hidup (batu, air, suhu, cahaya). Pilihan lain adalah makhluk hidup (biotik)."},
{"k": 7, "b": "Biologi", "q": "Kegiatan yang dapat menyebabkan hilangnya keanekaragaman hayati adalah…", "o": ["memburu hewan yang dilindungi", "membuat hutan lindung", "membuat undang-undang keanekaragaman hayati", "melakukan reboisasi"], "a": 0, "p": "Perburuan hewan dilindungi menurunkan populasi hingga punah. Hutan lindung, undang-undang, dan reboisasi justru melestarikan keanekaragaman hayati."},
{"k": 8, "b": "Biologi", "q": "Contoh hewan yang berkembang biak secara ovovivipar adalah ...", "o": ["Kucing dan sapi", "Ayam dan kelinci", "Ular piton dan penyu", "Hiu dan ular piton"], "a": 3, "p": "Ovovivipar: telur menetas di dalam tubuh induk (mis. beberapa hiu). Kunci file memilih hiu dan ular piton; catatan: ular piton umumnya ovipar."},
{"k": 8, "b": "Biologi", "q": "Yang bukan merupakan bahan-bahan yang diperlukan untuk fotosintesis adalah ...", "o": ["Oksigen", "Karbondioksida", "Air", "Cahaya matahari"], "a": 0, "p": "Bahan: CO2, air, cahaya. Oksigen adalah hasil. 6CO2 + 6H2O -> C6H12O6 + 6O2."},
{"k": 8, "b": "Biologi", "q": "Nama lain dari selaput jala dan selaput putih adalah ...", "o": ["Retina dan sklera", "Sklera dan retina", "Pupil dan iris", "Saraf optik dan kornea"], "a": 0, "p": "Selaput jala = retina (tempat bayangan terbentuk); selaput putih = sklera."},
{"k": 8, "b": "Biologi", "q": "Pada malam hari kelelawar mengeluarkan bunyi ultrasonik. Kemampuan pada kelelawar dimanfaatkan untuk ...", "o": ["Mencari makanan", "Sebagai petunjuk jalan", "Melindungi diri dari musuh", "Membantu mencari kelompoknya jika terpisah"], "a": 0, "p": "Kelelawar memancarkan ultrasonik dan menangkap pantulannya (ekolokasi) untuk mendeteksi mangsa dan rintangan, terutama untuk mencari makanan."},
{"k": 8, "b": "Biologi", "q": "Contoh pelestarian keanekaragaman secara institu adalah ...", "o": ["Taman Nasional Komodo", "Kebun Plasma Nutfah", "Taman Safari", "Kebun binatang"], "a": 0, "p": "Kunci file: Taman Nasional Komodo, dengan membaca soal sebagai in situ (di habitat asli). Kebun plasma nutfah, Taman Safari, dan kebun binatang termasuk ex situ."},
{"k": 8, "b": "Fisika", "q": "Contoh dalam kehidupan sehari-hari yang menunjukkan bahwa gas dalam ruang tertutup mengadakan tekanan pada dindingnya adalah ...", "o": ["Lilin yang menyala menjadi padam ketika ditutup gelas", "Balon yang berisi udara lebih berat dari balon kosong", "Balon yang berisi udara naik ke angkasa", "Meletusnya balon atau ban sepeda"], "a": 3, "p": "Gas dalam ruang tertutup menekan dinding ke segala arah. Balon atau ban meletus ketika tekanan gas melebihi kekuatan dindingnya."},
{"k": 8, "b": "Kimia", "q": "Unsur kimia yang paling banyak terdapat dalam tubuh manusia adalah ...", "o": ["Air, zat besi, dan kalsium", "Karbohidrat, lemak, dan oksigen", "Oksigen, karbon, dan hidrogen", "Karbohidrat, lemak, dan protein"], "a": 2, "p": "Tubuh manusia tersusun terutama atas oksigen (± 65%), karbon (± 18%), dan hidrogen (± 10%), lalu nitrogen."},
{"k": 8, "b": "Fisika", "q": "Upaya yang dapat dilakukan untuk mendapatkan tekanan yang besar adalah ...", "o": ["Mengurangi gaya tekan dan memperbesar luas bidang tekan", "Mengurangi gaya tekan dan memperkecil luas bidang tekan", "Meningkatkan gaya tekan dan memperbesar luas bidang tekan", "Meningkatkan gaya tekan dan memperkecil luas bidang tekan"], "a": 3, "p": "P = F/A. Tekanan membesar jika gaya diperbesar dan luas bidang tekan diperkecil (contoh: paku runcing)."},
{"k": 8, "b": "Biologi", "q": "Ujung saraf pada kulit yang peka terhadap sentuhan adalah ...", "o": ["Krause", "Ruffini", "Meissner", "Paccini"], "a": 2, "p": "Meissner: sentuhan. Krause: dingin. Ruffini: panas. Paccini: tekanan."},
{"k": 8, "b": "Fisika", "q": "Pada saat kita melakukan pengukuran tekanan darah dengan menggunakan tensimeter, maka berlaku hukum ...", "o": ["Pascal", "Archimedes", "Boyle", "Newton"], "a": 0, "p": "Hukum Pascal: tekanan pada fluida dalam ruang tertutup diteruskan sama besar ke segala arah."},
{"k": 8, "b": "Fisika", "q": "Mata manusia normal dapat mendeteksi gelombang elektromagnetik di daerah cahaya tampak, dengan kepekaan tertinggi pada cahaya warna hijau, yang panjang gelombangnya berada di sekitar ... nm.", "o": ["495-570", "570-590", "590-620", "620-750"], "a": 0, "p": "Cahaya hijau berpanjang gelombang sekitar 495-570 nm; mata paling peka di sekitar 555 nm."},
{"k": 8, "b": "Biologi", "q": "Jumlah energi per molekul glukosa yang dihasilkan selama proses anaerob adalah ...", "o": ["2 ATP", "4 ATP", "6 ATP", "8 ATP"], "a": 0, "p": "Glikolisis anaerob menghasilkan 2 ATP per molekul glukosa (aerob ± 36-38 ATP)."},
{"k": 8, "b": "Biologi", "q": "Susunan selaput otak dari arah luar ke dalam adalah ...", "o": ["Arachnoidea mater-durameter-piameter", "Durameter-piameter-arachnoidea meter", "Piameter-arachnoidea meter-durameter", "Durameter-arachnoidea meter-piameter"], "a": 3, "p": "Dari luar ke dalam: duramater, arachnoid, piamater."},
{"k": 8, "b": "Biologi", "q": "Pernyataan berikut yang tepat tentang reaksi katabolisme adalah ...", "o": ["Katabolisme termasuk reaksi endergonik", "Reaksi pembentukan senyawa sederhana menjadi kompleks", "Contoh katabolisme adalah respirasi", "Reaksi tersebut bersifat membutuhkan energi"], "a": 2, "p": "Katabolisme memecah molekul kompleks menjadi sederhana dan melepas energi, contohnya respirasi. Kebalikannya anabolisme (fotosintesis)."},
{"k": 8, "b": "Fisika", "q": "Bunyi yang bisa terdengar oleh manusia berfrekuensi ...", "o": ["10-15.000 Hz", "20-20.000 Hz", "40-21.000 Hz", "100-25.000 Hz"], "a": 1, "p": "Telinga manusia mendengar 20-20.000 Hz (audiosonik). Di bawahnya infrasonik, di atasnya ultrasonik."},
{"k": 8, "b": "Fisika", "q": "Apa yang menyebabkan roda mobil dapat menggelinding di jalan?", "o": ["Gaya gesek statis antara roda dengan jalanan", "Gaya gesek dinamik antara roda dengan jalanan", "Gaya dorong oleh mesin mobil", "Gaya gravitasi yang dialami oleh mobil"], "a": 0, "p": "Roda menggelinding tanpa tergelincir karena titik kontak roda diam sesaat terhadap jalan, ditahan gaya gesek statis. Kunci file tertulis dinamik (B), namun yang tepat statis (A)."},
{"k": 8, "b": "Biologi", "q": "Hubungan yang benar antara variabel lingkungan adalah ...", "o": ["BOD naik menyebabkan DO naik", "BOD turun menyebabkan DO naik", "Turbiditas berbanding lurus dengan penetrasi cahaya", "BOD naik menyebabkan pH naik"], "a": 1, "p": "BOD tinggi berarti banyak bahan organik diurai bakteri sehingga oksigen terlarut (DO) turun. Jadi BOD turun, DO naik."},
{"k": 8, "b": "Biologi", "q": "Perbedaan warna pada bunga mawar merupakan contoh keanekaragaman ...", "o": ["Gen", "Genus", "Jenis", "Varietas"], "a": 0, "p": "Perbedaan warna pada spesies yang sama (mawar) dikendalikan gen yang berbeda: keanekaragaman gen."},
{"k": 8, "b": "Fisika", "q": "Orang dapat membedakan suara asli dan gemanya jika ada jeda waktu minimal 0,1 detik antara suara asli dan gemanya. Seseorang berdiri di depan suatu tebing yang lebar dan tinggi, lalu berteriak. Jika kelajuan bunyi di udara 344 m/s dan orang tersebut mendengar gema teriakannya dengan jelas, maka jarak minimum tebing dari orang adalah...", "o": ["5,2 meter", "12,2 meter", "17,2 meter", "24,2 meter"], "a": 2, "p": "Bunyi pergi-pulang, jadi waktu satu arah = 0,05 s. s = v·t = 344 × 0,05 = 17,2 m."},
{"k": 8, "b": "Biologi", "q": "Stomata berfungsi untuk tempat keluar masuknya gas dan pada daun, Stomata yang cenderung terbuka pada siang hari ditemukan pada tumbuhan...", "o": ["C3", "C4", "CAM", "Conifera"], "a": 1, "p": "Kunci file: C4. Catatan: tumbuhan C3 juga membuka stomata pada siang hari, sedangkan CAM membukanya malam hari; soal ini cukup ambigu."},
{"k": 8, "b": "Biologi", "q": "Ciri mamalia yang tidak ditemukan pada hewan lain adalah...", "o": ["berambut", "berkaki dua pasang", "bernafas dengan paru paru", "homoiterm"], "a": 0, "p": "Berambut dan menyusui (kelenjar susu) adalah ciri unik mamalia. Bernapas dengan paru-paru juga dimiliki reptil, burung, dan amfibi dewasa. Kunci file tertulis C, namun yang tepat A."},
{"k": 8, "b": "Biologi", "q": "Ujung saraf yang menerima rasa dingin saat memegang es yaitu...", "o": ["paccini", "krause", "ruffini", "meissner"], "a": 1, "p": "Krause menerima rasa dingin; Ruffini panas; Meissner sentuhan; Paccini tekanan."},
{"k": 8, "b": "Biologi", "q": "Keanekaragaman gen dalam spesies terjadi antara…", "o": ["Bunga mawar,bunga krisan,bunga matahari", "ikan mas,ikan lele dan ikan gurami", "burung kakaktua raja,burung nuri,burung kakaktua jambul kuning", "burung merpati putih,burung merpati hitam,burung merpati abu abu"], "a": 3, "p": "Keanekaragaman gen: satu spesies dengan sifat berbeda, mis. merpati putih, hitam, abu-abu. Pilihan lain adalah antarjenis atau antargenus."},
{"k": 8, "b": "Biologi", "q": "Pada tumbuhan berikut,yang merupakan tumbuhan endemik Indonesia adalah….", "o": ["Hibiscus rosasinensis", "Rafflesia arnoldi", "Oryza sativa", "Morinda citrifolia"], "a": 1, "p": "Rafflesia arnoldii endemik Sumatra. Padi dan mengkudu tersebar luas, kembang sepatu bukan endemik Indonesia."},
{"k": 8, "b": "Biologi", "q": "Pelestarian alam ex situ dilakukan di….", "o": ["Kebun binatang", "Hutan lindung", "Cagar alam", "Taman nasional"], "a": 0, "p": "Ex situ adalah pelestarian di luar habitat asli: kebun binatang, kebun raya, bank gen. Hutan lindung, cagar alam, dan taman nasional adalah in situ."},
{"k": 9, "b": "Kimia", "q": "Perhatikan beberapa zat yang sering kita temukan berikut: 1) Kecap 2) Air 3) Air laut 4) Tepung terigu 5) Tembaga 6) Arang Yang termasuk senyawa dan campuran adalah...", "o": ["1), 2) dan 3), 6)", "2), 4) dan 1), 3)", "2), 6) dan 1) 3)", "3), 4) dan 2), 6)"], "a": 2, "p": "Air adalah senyawa; kecap, air laut, dan tepung terigu adalah campuran. Kunci file memilih C; catatan: arang umumnya karbon (unsur), jadi soal perlu dikoreksi."},
{"k": 9, "b": "IPBA", "q": "Peristiwa terperangkapnya panas matahari di lapisan bumi sehingga suhu bumi meningkat disebut...", "o": ["efek rumah kaca", "hujan asam", "penipisan lapisan ozon", "rusaknya lapisan ozon"], "a": 0, "p": "Gas rumah kaca (CO₂, CH₄) menahan panas yang dipantulkan bumi sehingga suhu naik: efek rumah kaca."},
{"k": 9, "b": "Kimia", "q": "Perhatikan sifat aluminium berikut: 1) Tidak mudah berkarat 2) Titik leburnya rendah 3) Ringan 4) Mudah bersenyawa dengan asam Sifat fisika dan sifat kimia aluminium sebagai dasar bahan pembuat pesawat terbang adalah...", "o": ["2) dan 4)", "2) dan 1)", "3) dan 1)", "3) dan 4)"], "a": 2, "p": "Ringan (sifat fisika) dan tidak mudah berkarat (sifat kimia) membuat aluminium cocok untuk badan pesawat."},
{"k": 9, "b": "Biologi", "q": "Urutan yang tepat mengenai perkembangan sel telur yang sudah dibuahi adalah ...", "o": ["Pembelahan, morula, gastrula, dan blastula", "Pembelahan, morula, blastula, dan gastrula", "Pembelahan, gastrula, morula, dan blastula", "Pembelahan, blastula, morula, dan gastrula"], "a": 1, "p": "Zigot membelah menjadi morula, lalu blastula, lalu gastrula."},
{"k": 9, "b": "Biologi", "q": "Informasi dari luar yang diterima oleh reseptor dari berbagai alat indra diteruskan oleh neuron ...", "o": ["Eferen", "Aferen", "Kranialis", "Spinalis"], "a": 1, "p": "Neuron aferen (sensorik) membawa impuls dari reseptor ke pusat saraf; eferen (motorik) dari pusat saraf ke efektor."},
{"k": 9, "b": "Biologi", "q": "Selain perkembangbiakan secara generatif, hewan juga dapat berkembangbiak secara vegetatif salah satunya dengan cara membelah diri. Contoh dari hewan yang berkembang biak secara membelah diri adalah ...", "o": ["Amoeba", "Cacing pipih", "Hydra", "Porifera"], "a": 0, "p": "Amoeba berkembang biak dengan membelah diri. Hydra bertunas, cacing pipih berfragmentasi."},
{"k": 9, "b": "Biologi", "q": "Contoh hewan berikut yang berkembang biak secara vivipar adalah ...", "o": ["Kucing dan sapi", "Ayam dan kelinci", "Ular piton dan penyu", "Hiu dan ular piton"], "a": 0, "p": "Vivipar melahirkan anak (kucing, sapi, kelinci). Ayam, penyu, dan ular piton bertelur."},
{"k": 9, "b": "Biologi", "q": "Pada malam hari kelelawar mengeluarkan bunyi ultrasonik. Kemampuan pada kelelawar dimanfaatkan untuk ...", "o": ["Mencari makanan", "Sebagai petunjuk jalan", "Melindungi diri dari musuh", "Membantu mencari kelompoknya jika terpisah"], "a": 0, "p": "Kelelawar memakai ekolokasi ultrasonik untuk mendeteksi mangsa, terutama untuk mencari makanan."},
{"k": 9, "b": "Biologi", "q": "Kedudukan makhluk hidup dalam sebuah ekosistem ada yang menjadi pemangsa dan dimangsa. Pada kedudukan tersebut yang menjadi konsumen tingkat I adalah ...", "o": ["Tumbuhan", "Karnivora I", "Herbivora", "Karnivora II"], "a": 2, "p": "Konsumen tingkat I adalah pemakan produsen, yaitu herbivora."},
{"k": 9, "b": "Biologi", "q": "Rumput - Jangkrik - Katak - Ular Pernyataan diatas merupakan salah satu contoh dari rantai makanan pada suatu ekosistem. Katak Memiliki peranan sebagai ...", "o": ["Produsen", "Konsumen tingkat II", "Konsumen tingkat I", "Konsumen tingkat III"], "a": 1, "p": "Rumput (produsen), jangkrik (konsumen I), katak (konsumen II), ular (konsumen III). Kunci file tertulis D, namun katak adalah konsumen tingkat II (B)."},
{"k": 9, "b": "Biologi", "q": "Perhatikan data berikut ini: i. bakteri ii. fungi iii. sel tumbuhan iv. virus Yang tidak memiliki membran adalah ...", "o": ["i, ii, dan iii", "i, ii, dan iv", "i dan iv", "iv saja"], "a": 2, "p": "Bakteri adalah prokariot tanpa membran inti, dan virus tidak punya membran sel. Jamur dan sel tumbuhan (eukariot) berinti bermembran."},
{"k": 9, "b": "Biologi", "q": "Secara umum virus adalah penyebab utama penyakit pada manusia, hewan, tumbuhan dan bakteri, virus diklasifikasikan sebagai organisme berdasarkan kehidupannya yaitu...", "o": ["Autotrof", "Parasit fakultatif", "Epifit", "Parasit obligat"], "a": 3, "p": "Virus hanya dapat hidup dan berkembang biak di dalam sel inang: parasit obligat."},
{"k": 9, "b": "Biologi", "q": "Stanley Miller berhasil membuktikan bahwa jika ke dalam tabung dialirkan uap amoniak, metana, dan bunga api listrik bertegangan tinggi, maka akan terbentuk ...", "o": ["Protein", "Asam amino", "Lipid", "Karbohidrat"], "a": 1, "p": "Percobaan Miller menirukan atmosfer purba (amonia, metana, hidrogen, uap air, petir) dan menghasilkan asam amino."},
{"k": 9, "b": "Biologi", "q": "Salah satu ekosistem paling beragam...", "o": ["Sawah", "Savannah", "Hutan hujan tropis", "Padang rumput"], "a": 2, "p": "Hutan hujan tropis paling beragam karena suhu, curah hujan, dan cahaya stabil sepanjang tahun."},
{"k": 9, "b": "Biologi", "q": "Urutan pembelahan mitosis yang benar adalah...", "o": ["profase-interfase-anafase-metafase-telofase", "interfase-profase-anafase-metafase-telofase", "interfase-profase-metafase-anafase-telofase", "interfase-telofase-metafase-profase-anafase"], "a": 2, "p": "Urutan: interfase, profase, metafase, anafase, telofase. Pada metafase kromosom berjajar di bidang pembelahan."},
{"k": 9, "b": "Biologi", "q": "Susunan selaput otak dari dalam ke luar yaitu...", "o": ["durometer-skull-pia mater-arachnoid", "arachnoid-skull-pia mater-dura mater", "pia mater-arachnoid-dura mater-skull", "skull-pia mater-durometer-arachnoid"], "a": 2, "p": "Dari dalam ke luar: pia mater, arachnoid, dura mater, tengkorak."},
{"k": 9, "b": "Kimia", "q": "Perhatikan beberapa perubahan benda berikut: 1) Beras ditumbuk menjadi tepung. 2) Lilin dipanaskan mencair. 3) Kedelai dibuat menjadi tempe. 4) Besi dipanaskan hingga berpijar. 5) Sampah membusuk. Perubahan fisika ditunjukkan oleh....", "o": ["1), 2) dan 3)", "1), 2) dan 4)", "2), 3) dan 5)", "3), 4) dan 5)"], "a": 1, "p": "Perubahan fisika: menumbuk (1), melebur (2), berpijar (4), tanpa zat baru. Tempe (3) dan pembusukan (5) membentuk zat baru."},
{"k": 9, "b": "Biologi", "q": "Bakteri Lactobacillus acidophilus memiliki banyak manfaat salah satunya untuk menangani infeksi bakteri pada vagina. Bakteri ini dapat ditemukan pada fermentasi....", "o": ["Tempe", "Yogurt", "Susu", "Roti"], "a": 1, "p": "Lactobacillus acidophilus ada pada yogurt, hasil fermentasi susu. Kunci file tertulis tempe, namun yang tepat yogurt (B)."},
{"k": 9, "b": "Biologi", "q": "Peleburan dua gamet yang dapat berupa nukleus untuk membentuk sel tunggal ( zigot ) atau peleburan nukleus merupakan pengertian dari....", "o": ["Pembuahan", "Menstruasi", "Pendarahan", "Luka"], "a": 0, "p": "Peleburan gamet jantan dan betina menjadi zigot disebut pembuahan (fertilisasi)."},
{"k": 9, "b": "Biologi", "q": "Pada mata terdapat yang dinamakan koroid. Pada koroid biasanya berwarna coklat kehitaman atau hitam, warna ini bertujuan untuk ...", "o": ["Agar cahaya tidak dipantulkan kembali", "Agar cahaya tersebut dapat diteruskan menuju otak", "Menyesuaikan warna kebanyakan orang Indonesia", "Agar membantu mempertahankan bentuk mata"], "a": 0, "p": "Koroid yang gelap menyerap cahaya berlebih sehingga tidak dipantulkan di dalam bola mata dan bayangan tidak kabur."},
{"k": 9, "b": "Biologi", "q": "Saluran yang menghubungkan antara kepala putik dengan ovarium adalah ...", "o": ["Bakal biji", "Tangkai putik", "Bakal buah", "Kelopak bunga"], "a": 1, "p": "Tangkai putik (stilus) menghubungkan kepala putik dengan bakal buah."},
{"k": 9, "b": "Fisika", "q": "Seseorang menggeser sebuah balok pada sebuah bidang datar dengan gaya konstan 2 N sejajar dengan bidang. Kecepatan balok berubah dari 1 m/s menjadi 9 m/s dalam dua detik. Apabila antara balok dengan bidang tidak ada gesekan , usaha yang dilakukan orang itu adalah...", "o": ["16 J", "20 J", "22 J", "25 J"], "a": 1, "p": "a = (9-1)/2 = 4 m/s². m = F/a = 2/4 = 0,5 kg. W = ΔEk = ½ · 0,5 · (81 - 1) = 20 J."},
{"k": 9, "b": "Fisika", "q": "Besaran di bawah ini yang merupakan besaran turunan dan sekaligus merupakan besaran vektor adalah...", "o": ["kuat arus listrik, gaya, kecepatan", "gaya, usaha, percepatan", "gaya berat, percepatan gravitasi, medan listrik", "temperatur, kelajuan, panjang lintasan"], "a": 2, "p": "Besaran turunan sekaligus vektor: gaya berat, percepatan gravitasi, medan listrik. Kuat arus, temperatur, dan panjang adalah besaran pokok."},
{"k": 9, "b": "Fisika", "q": "Sebuah mobil bermassa 1 ton bergerak dipercepat di tempat datar yang kasar dengan gaya gesekan 15 N. Jika dalam waktu 2 menit perubahan kecepatannya adalah 24 m/s, maka gaya dorong mesin adalah...", "o": ["185 N", "200 N", "215 N", "1.215 N"], "a": 2, "p": "a = 24/120 = 0,2 m/s². ΣF = m·a: F - 15 = 1000 × 0,2, jadi F = 215 N."},
{"k": 9, "b": "Biologi", "q": "Reaksi kimiawi yang membebaskan energi melalui perombakan nutrien dinamakan ...", "o": ["Asimilasi", "Dekarboksilasi", "Desimilasi", "Metabolisme"], "a": 2, "p": "Disimilasi (katabolisme) menguraikan zat organik sambil melepas energi, mis. respirasi. Asimilasi adalah penyusunan zat."},
{"k": 7, "b": "Fisika", "q": "Satuan SI untuk besaran massa dan suhu berturut-turut adalah ...", "o": ["gram dan Celsius", "gram dan Kelvin", "kilogram dan Kelvin", "kilogram dan Celsius"], "a": 2, "p": "Satuan SI massa adalah kilogram (kg) dan suhu adalah Kelvin (K). Gram dan Celsius bukan satuan SI."},
{"k": 7, "b": "Fisika", "q": "Panjang sebuah meja diukur dengan jangka sorong. Skala utama menunjukkan 4,2 cm dan garis ke-6 skala nonius berimpit dengan garis skala utama. Hasil pengukurannya adalah ...", "o": ["4,8 cm", "4,62 cm", "4,206 cm", "4,26 cm"], "a": 3, "p": "Ketelitian jangka sorong 0,1 mm = 0,01 cm. Hasil = 4,2 + 6 × 0,01 = 4,26 cm."},
{"k": 7, "b": "Fisika", "q": "Sebuah mobil melaju dengan kecepatan tetap 72 km/jam selama 10 menit. Jarak yang ditempuh adalah ...", "o": ["7,2 km", "12 km", "14,4 km", "720 m"], "a": 1, "p": "72 km/jam = 20 m/s dan 10 menit = 600 s. s = v·t = 20 × 600 = 12.000 m = 12 km."},
{"k": 7, "b": "Fisika", "q": "Balok kayu bermassa 120 g bervolume 200 cm³. Massa jenis kayu dan keadaannya bila dimasukkan ke air (1 g/cm³) adalah ...", "o": ["0,6 g/cm³, tenggelam", "1,7 g/cm³, terapung", "0,6 g/cm³, terapung", "1,7 g/cm³, tenggelam"], "a": 2, "p": "ρ = m/V = 120/200 = 0,6 g/cm³. Karena lebih kecil dari massa jenis air, balok terapung."},
{"k": 7, "b": "Fisika", "q": "Es bersuhu 0 °C dipanaskan hingga seluruhnya melebur. Selama proses melebur, suhu es ...", "o": ["tetap 0 °C", "naik terus", "turun", "naik lalu turun"], "a": 0, "p": "Kalor yang diserap dipakai untuk mengubah wujud (kalor lebur), bukan menaikkan suhu. Suhu tetap 0 °C sampai semua es melebur."},
{"k": 7, "b": "Kimia", "q": "Campuran garam dan air dapat dipisahkan dengan cara ...", "o": ["filtrasi", "destilasi", "sentrifugasi", "dekantasi"], "a": 1, "p": "Garam larut dalam air (campuran homogen). Destilasi menguapkan air dan meninggalkan garam. Filtrasi hanya memisahkan padatan yang tidak larut."},
{"k": 7, "b": "Kimia", "q": "Lambang unsur natrium, kalium, dan besi berturut-turut adalah ...", "o": ["N, Ka, Fe", "Ng, P, Fe", "Na, K, F", "Na, K, Fe"], "a": 3, "p": "Natrium = Na, kalium = K, besi = Fe (dari bahasa Latin ferrum)."},
{"k": 7, "b": "Kimia", "q": "Rumus kimia air, H₂O, menunjukkan bahwa tiap molekul air tersusun atas ...", "o": ["1 atom H dan 2 atom O", "2 atom H dan 2 atom O", "2 atom H dan 1 atom O", "1 atom H dan 1 atom O"], "a": 2, "p": "Angka 2 di belakang H berarti 2 atom hidrogen. O tanpa angka berarti 1 atom oksigen."},
{"k": 7, "b": "Biologi", "q": "Urutan takson dari yang terbesar ke yang terkecil yang benar adalah ...", "o": ["Kingdom, filum, kelas, ordo, famili, genus, spesies", "Kingdom, kelas, filum, ordo, famili, genus, spesies", "Kingdom, filum, ordo, kelas, genus, famili, spesies", "Spesies, genus, famili, ordo, kelas, filum, kingdom"], "a": 0, "p": "Urutannya: kingdom, filum/divisi, kelas, ordo, famili, genus, spesies. Semakin ke bawah, ciri makhluk hidupnya semakin mirip."},
{"k": 7, "b": "Biologi", "q": "Penulisan nama ilmiah padi yang benar menurut aturan binomial adalah ...", "o": ["oryza Sativa", "Oryza Sativa", "Oryza sativa", "ORYZA SATIVA"], "a": 2, "p": "Huruf pertama nama genus kapital, nama spesies huruf kecil semua, dan dicetak miring atau digarisbawahi."},
{"k": 7, "b": "Biologi", "q": "Organel sel yang berfungsi menghasilkan energi (ATP) melalui respirasi sel adalah ...", "o": ["Ribosom", "Mitokondria", "Lisosom", "Badan Golgi"], "a": 1, "p": "Mitokondria adalah pusat respirasi sel dan penghasil ATP. Ribosom membuat protein, lisosom mencerna zat, badan Golgi mensekresikan zat."},
{"k": 7, "b": "IPBA", "q": "Lapisan atmosfer tempat terjadinya peristiwa cuaca seperti awan dan hujan adalah ...", "o": ["Stratosfer", "Mesosfer", "Termosfer", "Troposfer"], "a": 3, "p": "Troposfer (0-12 km) adalah lapisan terbawah yang mengandung uap air sehingga terjadi awan dan hujan. Lapisan ozon ada di stratosfer."},
{"k": 7, "b": "IPBA", "q": "Urutan proses utama dalam siklus air yang benar adalah ...", "o": ["evaporasi, kondensasi, presipitasi", "kondensasi, evaporasi, presipitasi", "presipitasi, evaporasi, kondensasi", "evaporasi, presipitasi, kondensasi"], "a": 0, "p": "Air menguap (evaporasi), uap mengembun menjadi awan (kondensasi), lalu jatuh sebagai hujan (presipitasi)."},
{"k": 7, "b": "IPBA", "q": "Pergantian siang dan malam di bumi disebabkan oleh ...", "o": ["revolusi bumi", "rotasi bumi", "revolusi bulan", "kemiringan sumbu bumi"], "a": 1, "p": "Bumi berputar pada sumbunya (rotasi) selama ± 24 jam sehingga bagian bumi bergantian menghadap Matahari."},
{"k": 7, "b": "Topik Lanjutan", "q": "Andi meneliti pengaruh cahaya terhadap pertumbuhan kecambah. Variabel manipulasi pada penelitiannya adalah ...", "o": ["tinggi kecambah", "intensitas cahaya", "jumlah air", "jenis biji"], "a": 1, "p": "Variabel manipulasi adalah yang sengaja diubah, yaitu intensitas cahaya. Tinggi kecambah adalah variabel respons; air dan jenis biji harus dijaga tetap (kontrol)."},
{"k": 8, "b": "Fisika", "q": "Seorang penyelam berada pada kedalaman 10 m dari permukaan air (ρ = 1.000 kg/m³, g = 10 m/s²). Tekanan hidrostatis yang dialaminya adalah ...", "o": ["1.000 Pa", "10.000 Pa", "1.000.000 Pa", "100.000 Pa"], "a": 3, "p": "P = ρ·g·h = 1.000 × 10 × 10 = 100.000 Pa."},
{"k": 8, "b": "Fisika", "q": "Balok bervolume 500 cm³ tercelup seluruhnya dalam air (ρ = 1.000 kg/m³, g = 10 m/s²). Gaya Archimedes yang bekerja adalah ...", "o": ["0,5 N", "5 N", "50 N", "500 N"], "a": 1, "p": "Fa = ρ·g·V = 1.000 × 10 × 0,0005 = 5 N (500 cm³ = 0,0005 m³)."},
{"k": 8, "b": "Fisika", "q": "Pada dongkrak hidrolik, pengisap kecil luasnya 10 cm² diberi gaya 20 N. Gaya yang dihasilkan pengisap besar berluas 200 cm² adalah ...", "o": ["400 N", "40 N", "200 N", "4.000 N"], "a": 0, "p": "Hukum Pascal: F1/A1 = F2/A2. F2 = 20 × 200/10 = 400 N."},
{"k": 8, "b": "Fisika", "q": "Gelombang merambat dengan frekuensi 50 Hz dan panjang gelombang 4 m. Cepat rambat gelombang tersebut adalah ...", "o": ["12,5 m/s", "200 m/s", "54 m/s", "400 m/s"], "a": 1, "p": "v = λ·f = 4 × 50 = 200 m/s."},
{"k": 8, "b": "Fisika", "q": "Sebuah benda berada 30 cm di depan cermin cekung berjari-jari 40 cm. Jarak bayangan dari cermin adalah ...", "o": ["12 cm", "24 cm", "60 cm", "120 cm"], "a": 2, "p": "f = R/2 = 20 cm. 1/s' = 1/f - 1/s = 1/20 - 1/30 = 1/60, sehingga s' = 60 cm (nyata, terbalik, diperbesar)."},
{"k": 8, "b": "Kimia", "q": "Larutan yang dapat mengubah lakmus merah menjadi biru dan ber-pH 12 bersifat ...", "o": ["asam kuat", "basa", "asam lemah", "netral"], "a": 1, "p": "Basa mengubah lakmus merah menjadi biru dan ber-pH > 7. pH 12 menunjukkan basa yang cukup kuat."},
{"k": 8, "b": "Kimia", "q": "Pembakaran metana: CH₄ + O₂ → CO₂ + H₂O. Setelah disetarakan, koefisien O₂ dan H₂O berturut-turut adalah ...", "o": ["2 dan 1", "1 dan 2", "3 dan 2", "2 dan 2"], "a": 3, "p": "CH₄ + 2O₂ → CO₂ + 2H₂O. Atom C 1 = 1, H 4 = 4, O 4 = 4."},
{"k": 8, "b": "Kimia", "q": "Senyawa yang terbentuk melalui ikatan ionik adalah ...", "o": ["NaCl", "H₂O", "CO₂", "CH₄"], "a": 0, "p": "NaCl terbentuk dari logam Na yang melepas elektron dan nonlogam Cl yang menerima elektron. Pilihan lain berikatan kovalen antar nonlogam."},

{"k": 9, "b": "Fisika", "q": "Resistor 6 Ω dan 3 Ω disusun paralel, lalu diseri dengan resistor 4 Ω dan dihubungkan ke sumber 12 V. Kuat arus total rangkaian adalah ...", "o": ["0,8 A", "1,2 A", "2 A", "3 A"], "a": 2, "p": "Rp = (6 × 3)/(6 + 3) = 2 Ω. Rtotal = 2 + 4 = 6 Ω. I = V/R = 12/6 = 2 A."},

{"k": 9, "b": "Topik Lanjutan", "q": "Pada kromatografi kertas, noda zat berada 3 cm dari garis awal, sedangkan pelarut bergerak 6 cm. Nilai Rf zat tersebut adalah ...", "o": ["0,25", "0,5", "2,0", "3,0"], "a": 1, "p": "Rf = jarak tempuh zat/jarak tempuh pelarut = 3/6 = 0,5."},

["Mekanika: gerak, gaya, hukum Newton",["GLB: s = v·t. GLBB: vt = v0 + a·t; s = v0·t + ½a·t²; vt² = v0² + 2a·s. Jatuh bebas: a = g ≈ 10 m/s², h = ½g·t².","Grafik v-t: kemiringan = percepatan, luas = perpindahan. Grafik s-t: kemiringan = kecepatan.","Gerak melingkar beraturan: kelajuan tetap, arah berubah, ada percepatan sentripetal a = v²/r; v = 2πr/T. Gerak parabola: horizontal GLB, vertikal GLBB, jangkauan terjauh pada sudut 45°.","Newton I: ΣF = 0 benda diam atau GLB (kelembaman). Newton II: ΣF = m·a. Newton III: aksi = -reaksi, bekerja pada benda yang berbeda.","Gaya berat w = m·g; gaya gesek f = μ·N. Gesek statis menahan benda diam dan membuat roda menggelinding.","Usaha W = F·s·cosθ; Ek = ½mv²; Ep = mgh; W = ΔEk; Em = Ep + Ek kekal tanpa gesekan; daya P = W/t. Tuas: KM = lengan kuasa/lengan beban; bidang miring KM = s/h."]],
["Fluida, energi, zat dan kalor",["Massa jenis ρ = m/V (air 1.000 kg/m³). Tekanan P = F/A. Tekanan hidrostatis P = ρ·g·h bergantung kedalaman, bukan bentuk wadah. 1 atm ≈ 76 cmHg ≈ 101.325 Pa.","Pascal: tekanan diteruskan sama besar, F1/A1 = F2/A2 (dongkrak, rem hidrolik, tensimeter).","Archimedes: Fa = ρ fluida·g·V tercelup. Terapung jika ρ benda < ρ fluida, melayang jika sama, tenggelam jika lebih besar. Berat semu = w - Fa.","Bernoulli: kecepatan fluida besar, tekanan kecil (gaya angkat sayap pesawat, penyemprot parfum). Kohesi, adhesi, kapilaritas, tegangan permukaan.","Suhu: K = °C + 273; °F = 9/5·°C + 32. Pemuaian ΔL = L0·α·ΔT.","Kalor: Q = m·c·ΔT; perubahan wujud Q = m·L; c air = 4.200 J/kg°C. Asas Black: kalor lepas = kalor terima. Perpindahan kalor: konduksi, konveksi, radiasi. Energi tidak hilang, hanya berubah bentuk."]],
["Getaran, gelombang dan bunyi",["Getaran: f = n/t, T = 1/f. Bandul sederhana T = 2π√(l/g) tidak bergantung massa; pegas T = 2π√(m/k).","Gelombang transversal (bukit-lembah: tali, cahaya) dan longitudinal (rapatan-renggangan: bunyi). v = λ·f. Sifat: pantul, bias, difraksi, interferensi; polarisasi hanya pada transversal.","Bunyi butuh medium. Cepat rambat: padat > cair > gas (udara ± 340 m/s). Infrasonik < 20 Hz, audio 20-20.000 Hz, ultrasonik > 20.000 Hz (kelelawar, lumba-lumba, USG, sonar).","Pemantulan: gema (terdengar terpisah, jeda ≥ 0,1 s) dan gaung. Kedalaman laut d = v·t/2. Nada ditentukan frekuensi, kerasnya amplitudo. Resonansi terjadi saat frekuensi alami sama."]],
["Cahaya dan optika",["Cahaya adalah gelombang elektromagnetik, c = 3 × 10⁸ m/s di vakum. Cahaya tampak 380-750 nm; mata paling peka pada hijau (± 555 nm).","Pemantulan: sudut datang = sudut pantul. Cermin datar: bayangan maya, tegak, sama besar. Cermin cekung mengumpulkan cahaya (f = R/2); cermin cembung selalu maya, tegak, diperkecil (spion).","Rumus: 1/f = 1/s + 1/s'; M = |s'/s| = h'/h. Benda di ruang I cermin cekung (s < f): maya, tegak, diperbesar.","Pembiasan: dari medium renggang ke rapat dibelokkan mendekati normal. n = c/v; Snellius n1·sin i = n2·sin r. Pemantulan sempurna dipakai serat optik. Dispersi menghasilkan pelangi.","Lensa cembung mengumpulkan, lensa cekung menyebarkan; kekuatan P = 100/f (cm) dioptri. Mata: miopia dibantu lensa cekung, hipermetropi lensa cembung. Alat optik: lup, mikroskop, teleskop, kamera."]],
["Kelistrikan dan kemagnetan",["Muatan sejenis tolak-menolak, berbeda jenis tarik-menarik. Arus I = Q/t. Hukum Ohm V = I·R; hambatan kawat R = ρ·l/A.","Seri: Rs = R1 + R2, arus sama, tegangan terbagi. Paralel: 1/Rp = 1/R1 + 1/R2, tegangan sama, arus terbagi. Kirchhoff I: arus masuk = arus keluar.","Daya P = V·I = I²R = V²/R; energi W = P·t (kWh). Rumah memakai rangkaian paralel; sekering dipasang seri.","Magnet: kutub senama tolak, tak senama tarik. Kawat berarus menimbulkan medan magnet (kaidah tangan kanan). Gaya Lorentz F = B·I·L pada motor listrik.","Induksi Faraday (ggl) pada generator dan dinamo. Transformator Vp/Vs = Np/Ns; step-up bila Ns > Np; trafo ideal Pp = Ps."]]
]],
"Kimia":["⚗️",[
["Struktur atom dan sistem periodik",["Model atom: Dalton (bola pejal), Thomson (roti kismis), Rutherford (inti atom), Bohr (kulit/lintasan).","Proton (+) dan neutron (netral) di inti, elektron (-) di kulit. Nomor atom = jumlah proton; nomor massa = proton + neutron.","Isotop: proton sama, neutron beda. Isobar: nomor massa sama. Isoton: neutron sama. Kation = kehilangan elektron, anion = menerima elektron.","Konfigurasi elektron per kulit 2-8-8-18. Elektron valensi menentukan golongan, jumlah kulit menentukan periode.","Golongan IA alkali, IIA alkali tanah, VIIA halogen, VIIIA gas mulia. Dari kiri ke kanan sifat nonlogam bertambah; dari atas ke bawah jari-jari atom membesar."]],
["Ikatan kimia",["Atom berikatan agar stabil seperti gas mulia: oktet (8 elektron valensi), duplet untuk H dan He.","Ionik: serah-terima elektron antara logam dan nonlogam (NaCl, MgO); titik leleh tinggi, lelehan dan larutannya menghantar listrik.","Kovalen: pemakaian bersama pasangan elektron antar nonlogam (H₂O, CO₂, O₂ rangkap dua, N₂ rangkap tiga); titik leleh rendah, umumnya bukan penghantar.","Ikatan logam: lautan elektron, menghantar listrik dan panas, dapat ditempa. Ikatan hidrogen antar molekul air membuat titik didihnya tinggi."]],
["Reaksi dan persamaan kimia",["Perubahan fisika tidak membentuk zat baru (melebur, menguap, melarut, menumbuk). Perubahan kimia membentuk zat baru: pembakaran, perkaratan, pembusukan, fermentasi. Tandanya: gas, endapan, warna, suhu atau cahaya berubah.","Unsur (Fe, O₂), senyawa (H₂O, NaCl; komposisi tetap, diuraikan secara kimia), campuran (homogen atau heterogen; dipisah secara fisika: filtrasi, destilasi, kristalisasi, sublimasi, kromatografi).","Hukum Lavoisier: massa sebelum = sesudah reaksi. Hukum Proust: perbandingan massa unsur dalam senyawa tetap (H : O = 1 : 8 pada air).","Penyetaraan: jumlah tiap atom kiri = kanan. 2H₂ + O₂ → 2H₂O; CH₄ + 2O₂ → CO₂ + 2H₂O. Mr = jumlah Ar (H 1, C 12, N 14, O 16, Na 23, Cl 35,5).","Eksoterm melepas kalor (pembakaran), endoterm menyerap kalor (fotosintesis)."]],
["Sifat asam, basa dan garam",["Asam: rasa masam, pH < 7, lakmus biru → merah, melepas H⁺ (HCl, H₂SO₄, cuka CH₃COOH, asam sitrat).","Basa: licin, pahit, pH > 7, lakmus merah → biru, melepas OH⁻ (NaOH, KOH, Ca(OH)₂, NH₃). Netral pH = 7.","Indikator: lakmus, fenolftalein (basa merah muda), indikator universal, indikator alami (kubis ungu, kunyit, bunga sepatu).","Netralisasi: asam + basa → garam + air (HCl + NaOH → NaCl + H₂O). Asam + logam → garam + H₂. Contoh: antasida, pengapuran tanah masam.","Garam: NaCl (dapur), NaHCO₃ (soda kue), CaCO₃. Hujan asam akibat SO₂ dan NOx (pH < 5,6)."]],
["Zat aditif dan adiktif",["Aditif makanan: pewarna, pemanis (sakarin, aspartam), pengawet (natrium benzoat), penyedap (MSG), pengental, antioksidan; bisa alami atau sintetis.","Dilarang dalam makanan: boraks, formalin, rhodamin B, metanil yellow. Batasi sesuai takaran dan baca label.","Adiktif: narkotika (morfin, heroin, ganja), psikotropika (sabu, ekstasi), alkohol, nikotin; kafein ringan. Menimbulkan ketagihan, toleransi, dan gejala putus zat.","Dampak: merusak otak, paru-paru, hati, jantung. Pencegahan: edukasi, kegiatan positif, memilih pergaulan; pengguna perlu rehabilitasi."]]
]],
"Biologi":["🌿",[
["Organisasi kehidupan (seluler)",["Teori sel: sel adalah unit struktural dan fungsional; sel berasal dari sel (Virchow). Hirarki: sel, jaringan, organ, sistem organ, organisme, populasi, komunitas, ekosistem, biosfer.","Organel: inti (DNA), mitokondria (respirasi, ATP), ribosom (protein), retikulum endoplasma, badan Golgi (sekresi), lisosom (pencernaan), kloroplas, vakuola. Dinding sel hanya pada tumbuhan; membran sel selektif permeabel.","Prokariot (tanpa membran inti: bakteri) dan eukariot. Virus tanpa membran dan tanpa struktur sel, parasit obligat.","Transpor: difusi, osmosis (air ke larutan lebih pekat), transpor aktif (butuh ATP), endositosis dan eksositosis.","Jaringan tumbuhan: meristem, epidermis, parenkim, xilem, floem. Jaringan hewan: epitel, otot, saraf, ikat."]],
["Keanekaragaman dan pengelompokan",["Tiga tingkat: gen (warna mawar berbeda), jenis/spesies, ekosistem. Tata nama binomial Linnaeus: Genus spesies (Oryza sativa).","Takson: kingdom, filum/divisi, kelas, ordo, famili, genus, spesies. Kingdom: Monera, Protista, Fungi, Plantae, Animalia. Kunci determinasi dikotom dipakai untuk identifikasi.","Hewan: vertebrata (pisces, amfibi, reptil, aves, mamalia) dan invertebrata (porifera, cnidaria, platyhelminthes, nemathelminthes, annelida, mollusca, arthropoda, echinodermata). Ciri khas mamalia: berambut dan menyusui.","Tumbuhan: lumut, paku, gymnospermae (biji terbuka), angiospermae (biji tertutup: monokotil dan dikotil).","Endemik Indonesia: komodo, Rafflesia arnoldii, jalak Bali, anoa. Pelestarian in situ (cagar alam, taman nasional) dan ex situ (kebun binatang, kebun plasma nutfah). Ancaman: perburuan, deforestasi, spesies invasif."]],
["Struktur dan fungsi tumbuhan",["Akar menyerap air dan mineral (rambut akar); batang menopang dan mengangkut; daun tempat fotosintesis (epidermis, mesofil palisade dan spons, stomata).","Xilem mengangkut air dan mineral ke atas; floem mengangkut hasil fotosintesis ke seluruh tubuh. Kambium pada dikotil menyebabkan batang membesar.","Stomata untuk pertukaran gas dan transpirasi. Tumbuhan C3 membuka stomata siang, C4 (jagung, tebu) hemat air, CAM (kaktus, nanas) membuka stomata malam.","Bunga: kelopak (calyx), mahkota (corolla), benang sari (kepala sari, tangkai sari), putik (kepala putik, tangkai putik, bakal buah). Penyerbukan, pembuahan, lalu terbentuk biji.","Gerak: tropisme (arah rangsang: foto-, geo-, hidro-, tigmotropisme), nasti (tidak bergantung arah: putri malu, daun lamtoro), taksis (pindah tempat: gerak kloroplas terhadap cahaya = fototaksis). Hormon: auksin, giberelin, sitokinin, etilen."]],
["Sistem organ manusia dan hewan",["Pencernaan: mulut, kerongkongan, lambung (HCl, pepsin), usus halus (penyerapan; empedu, pankreas), usus besar (air). Enzim: amilase (karbohidrat), pepsin (protein), lipase (lemak).","Pernapasan: hidung, trakea, bronkus, alveolus (difusi O₂ dan CO₂). Peredaran darah ganda, jantung 4 ruang; darah: eritrosit (hemoglobin), leukosit, trombosit, plasma.","Ekskresi: ginjal (glomerulus menyaring, tubulus proksimal reabsorpsi, tubulus distal augmentasi), kulit, paru-paru, hati. Protein dalam urine menandakan kerusakan glomerulus.","Saraf: neuron sensorik/aferen, motorik/eferen, asosiasi. Selaput otak dari luar: duramater, arachnoid, piamater. Lengkung refleks tidak melalui otak.","Indra: mata (kornea, iris, pupil, lensa, retina dengan sel batang dan kerucut, sklera, koroid), telinga (membran timpani, tulang pendengar, koklea), kulit (Meissner sentuh, Krause dingin, Ruffini panas, Paccini tekanan).","Hewan: kelelawar memakai ekolokasi ultrasonik; lumba-lumba menerima getaran lewat rahang bawah."]],
["Reproduksi, fotosintesis dan respirasi",["Manusia: fertilisasi → zigot → morula → blastula → gastrula → embrio. Siklus menstruasi ± 28 hari, ovulasi sekitar hari ke-14.","Hewan: ovipar (ayam, penyu), vivipar (kucing, sapi), ovovivipar (beberapa hiu dan kadal). Metamorfosis sempurna: telur, larva, pupa, imago (kupu-kupu, lalat). Tidak sempurna: telur, nimfa, imago (belalang, kecoa). Vegetatif: membelah (amoeba), tunas (hydra), fragmentasi (planaria).","Fotosintesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ di kloroplas (reaksi terang dan gelap). Faktor: cahaya, CO₂, suhu, air.","Respirasi aerob: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ± 36-38 ATP (mitokondria). Anaerob: 2 ATP; fermentasi alkohol pada ragi (etanol + CO₂), asam laktat pada otot.","Katabolisme memecah molekul dan melepas energi (respirasi); anabolisme menyusun molekul dan memerlukan energi (fotosintesis)."]],
["Ekologi, pewarisan sifat dan bioteknologi",["Komponen biotik (produsen, konsumen I, II, III, pengurai) dan abiotik. Rantai dan jaring-jaring makanan; energi yang diteruskan ± 10% tiap tingkat. Interaksi: mutualisme, komensalisme, parasitisme, predasi, kompetisi.","Daur karbon, nitrogen, air. Masalah lingkungan: pemanasan global (CO₂, CH₄), efek rumah kaca, hujan asam, eutrofikasi. Kualitas air: BOD naik, DO turun.","DNA → gen → kromosom (manusia 46 = 23 pasang). Mendel: dominan/resesif, genotip (TT, Tt, tt) dan fenotip. Tt × Tt: fenotip 3 : 1, genotip 1 : 2 : 1; dihibrid 9 : 3 : 3 : 1.","Golongan darah ABO (alel IA, IB, i). Gen terpaut kelamin: buta warna, hemofilia. Variasi berasal dari mutasi dan rekombinasi.","Bioteknologi konvensional (fermentasi): tempe (Rhizopus), tape (Saccharomyces), oncom (Neurospora), kecap (Aspergillus), yogurt (Lactobacillus), nata de coco (Acetobacter xylinum). Modern: kultur jaringan, rekayasa genetika, kloning, vaksin."]]
]],
"IPBA":["🌍",[
["Struktur dan lapisan bumi",["Kerak (litosfer), mantel (astenosfer, magma), inti luar (cair), inti dalam (padat, besi-nikel). Suhu dan tekanan naik ke pusat bumi.","Lempeng tektonik: divergen (menjauh), konvergen (bertumbukan atau menunjam), transform (bergeser). Indonesia di pertemuan lempeng Eurasia, Indo-Australia, Pasifik: rawan gempa dan gunung api (Cincin Api).","Gempa: hiposentrum (pusat di dalam bumi), episentrum (di permukaan). Gelombang P longitudinal dan lebih cepat, gelombang S transversal. Kekuatan: magnitudo (Richter).","Batuan: beku (granit, basal), sedimen (batu pasir, batu gamping), metamorf (marmer, sabak). Pelapukan, erosi, sedimentasi membentuk muka bumi."]],
["Siklus air, cuaca dan bencana alam",["Siklus air: evaporasi, transpirasi, kondensasi, presipitasi, infiltrasi, limpasan; digerakkan energi Matahari.","Atmosfer: troposfer (cuaca), stratosfer (lapisan ozon), mesosfer, termosfer, eksosfer. Komposisi: N₂ 78%, O₂ 21%.","Cuaca (jangka pendek) dan iklim (jangka panjang). Alat: termometer, barometer, higrometer, anemometer, pluviometer. Angin bergerak dari tekanan tinggi ke rendah (angin darat, laut, muson).","Hujan konveksi, orografis, frontal. Awan: kumulus, stratus, sirus, kumulonimbus.","Bencana: banjir, longsor, kekeringan, puting beliung, tsunami, letusan gunung api. Mitigasi: jalur evakuasi, penghijauan, sistem peringatan dini."]],
["Tata surya",["Matahari adalah bintang pusat; 8 planet: Merkurius, Venus, Bumi, Mars (kebumian), Jupiter, Saturnus (raksasa gas), Uranus, Neptunus (raksasa es). Pluto planet kerdil.","Kepler I: orbit berbentuk elips. Kepler II: luas sapuan sama dalam waktu sama. Kepler III: T²/R³ tetap, planet jauh beredar lebih lambat. Gravitasi F = G·m1·m2/r².","Asteroid (antara Mars dan Jupiter), komet (ekor selalu menjauhi Matahari karena angin Matahari), meteoroid-meteor-meteorit, satelit alami.","Matahari: fusi hidrogen menjadi helium; lapisan fotosfer, kromosfer, korona; bintik Matahari. 1 SA ≈ 150 juta km. Venus terpanas karena efek rumah kaca."]],
["Pengaruh rotasi dan revolusi bumi",["Rotasi (± 24 jam, barat ke timur): siang-malam, gerak semu harian Matahari, perbedaan waktu (15° = 1 jam; WIB, WITA, WIT), pembelokan arah angin, bumi pepat di kutub.","Revolusi (365¼ hari, kabisat tiap 4 tahun) dengan sumbu miring 23,5°: pergantian musim, gerak semu tahunan Matahari, panjang siang-malam berbeda, rasi bintang berubah.","Titik balik Matahari 21 Juni (utara) dan 22 Desember (selatan). Ekuinoks 21 Maret dan 23 September: siang sama dengan malam.","Bulan: rotasi = revolusi ± 27,3 hari (sisi sama menghadap Bumi); fase 29,5 hari. Gerhana Matahari saat bulan baru, gerhana Bulan saat purnama. Pasang surut akibat gravitasi Bulan dan Matahari; pasang tertinggi saat bulan baru dan purnama."]]
]],
"Topik Lanjutan":["🔍",[
["Forensik",["Prinsip Locard: setiap kontak meninggalkan jejak. Bukti: sidik jari, darah, rambut, serat, jejak sepatu, residu.","Sidik jari berpola loop, whorl, arch; diangkat dengan bubuk atau uap iodin/ninhidrin. Jaga bukti: sarung tangan, kantong dan label bukti, catat rantai penyimpanan.","Uji sederhana: iodin (amilum biru-hitam), Benedict (gula pereduksi merah bata), biuret (protein ungu), pH indikator, kromatografi kertas untuk memisahkan pigmen tinta (Rf = jarak zat/jarak pelarut), uji nyala.","Golongan darah ABO dan DNA untuk identifikasi. Kesimpulan harus berdasar bukti dan dokumentasi (foto, catatan), bukan dugaan."]],
["Eksperimen",["Langkah ilmiah: pengamatan, rumusan masalah, hipotesis, rancangan, pengambilan data, analisis, kesimpulan, laporan.","Variabel manipulasi (diubah), respons (diukur), kontrol (dijaga tetap). Ubah satu variabel saja; bandingkan dengan kelompok kontrol.","Data: tabel dan grafik (x = variabel manipulasi, y = respons, beri judul dan satuan). Ulangi 3 kali dan rata-ratakan. Ketidakpastian alat = ½ skala terkecil.","Contoh: faktor fotosintesis pada Hydrilla, periode bandul, daya apung, indikator kubis ungu, kecambah gelap-terang.","Keselamatan: pakai jas dan kacamata, jangan mencicipi bahan, tangani asam-basa dan api dengan hati-hati, buang limbah sesuai aturan."]]
]]
